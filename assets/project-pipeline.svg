<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">智能救援视觉项目流程</title>
  <desc id="desc">从数据集采集与标注、模型训练、YOLOv8 INT8量化，到MaixCAM Pro端侧部署和实际运行验证的流程图</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .step { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .detail { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .tag { font: 700 14px "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="title">从数据到端侧运行的完整视觉流程</text>

  <g filter="url(#shadow)">
    <rect x="42" y="122" width="190" height="190" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="42" y="122" width="190" height="38" rx="18" fill="#2563eb"/>
    <rect x="42" y="142" width="190" height="18" fill="#2563eb"/>
    <text x="137" y="148" text-anchor="middle" class="tag">01  DATASET</text>
    <text x="137" y="207" text-anchor="middle" class="step">采集与标注</text>
    <text x="137" y="241" text-anchor="middle" class="detail">350 张原始图像</text>
    <text x="137" y="267" text-anchor="middle" class="detail">训练集 / 验证集</text>
    <text x="137" y="293" text-anchor="middle" class="detail">人工标注六类目标</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="122" width="190" height="190" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="270" y="122" width="190" height="38" rx="18" fill="#16a34a"/>
    <rect x="270" y="142" width="190" height="18" fill="#16a34a"/>
    <text x="365" y="148" text-anchor="middle" class="tag">02  TRAINING</text>
    <text x="365" y="207" text-anchor="middle" class="step">训练与增强</text>
    <text x="365" y="241" text-anchor="middle" class="detail">Albumentations</text>
    <text x="365" y="267" text-anchor="middle" class="detail">训练集扩展到约 900 张</text>
    <text x="365" y="293" text-anchor="middle" class="detail">YOLOv8 目标检测</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="498" y="122" width="190" height="190" rx="18" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="498" y="122" width="190" height="38" rx="18" fill="#d97706"/>
    <rect x="498" y="142" width="190" height="18" fill="#d97706"/>
    <text x="593" y="148" text-anchor="middle" class="tag">03  OPTIMIZATION</text>
    <text x="593" y="207" text-anchor="middle" class="step">INT8 量化</text>
    <text x="593" y="241" text-anchor="middle" class="detail">YOLOv8 INT8 量化模型</text>
    <text x="593" y="267" text-anchor="middle" class="detail">转换为 NPU 模型格式</text>
    <text x="593" y="293" text-anchor="middle" class="detail">保留端侧推理能力</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="726" y="122" width="190" height="190" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="726" y="122" width="190" height="38" rx="18" fill="#7c3aed"/>
    <rect x="726" y="142" width="190" height="18" fill="#7c3aed"/>
    <text x="821" y="148" text-anchor="middle" class="tag">04  DEPLOYMENT</text>
    <text x="821" y="207" text-anchor="middle" class="step">端侧部署</text>
    <text x="821" y="241" text-anchor="middle" class="detail">MaixCAM Pro</text>
    <text x="821" y="267" text-anchor="middle" class="detail">SG2002 NPU</text>
    <text x="821" y="293" text-anchor="middle" class="detail">MaixPy / MaixVision</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="954" y="122" width="204" height="190" rx="18" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
    <rect x="954" y="122" width="204" height="38" rx="18" fill="#e11d48"/>
    <rect x="954" y="142" width="204" height="18" fill="#e11d48"/>
    <text x="1056" y="148" text-anchor="middle" class="tag">05  VALIDATION</text>
    <text x="1056" y="207" text-anchor="middle" class="step">实际运行验证</text>
    <text x="1056" y="241" text-anchor="middle" class="detail">纯视觉推理 39.85 FPS</text>
    <text x="1056" y="267" text-anchor="middle" class="detail">完整链路 29.98 FPS</text>
    <text x="1056" y="293" text-anchor="middle" class="detail">UART 输出与状态切换</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 235 217 H 261"/>
    <path d="M 463 217 H 489"/>
    <path d="M 691 217 H 717"/>
    <path d="M 919 217 H 945"/>
  </g>

  <text x="600" y="376" text-anchor="middle" class="detail">数据集 → 模型 → 端侧平台 → 实际运行结果</text>
</svg>
