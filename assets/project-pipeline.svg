<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-labelledby="title desc">
  <title id="title">项目流程</title>
  <desc id="desc">数据采集与标注、模型训练、INT8量化、端侧部署、实际运行</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.5; }
      .step { font: 600 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .detail { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
      .line { fill: none; stroke: #4b5563; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="210" fill="#ffffff"/>

  <g>
    <rect class="box" x="20" y="55" width="180" height="100" rx="4"/>
    <text class="step" x="110" y="96" text-anchor="middle">数据采集与标注</text>
    <text class="detail" x="110" y="126" text-anchor="middle">350 张原始图像</text>

    <rect class="box" x="240" y="55" width="180" height="100" rx="4"/>
    <text class="step" x="330" y="96" text-anchor="middle">训练与数据增强</text>
    <text class="detail" x="330" y="126" text-anchor="middle">YOLOv8 / 约 900 张</text>

    <rect class="box" x="460" y="55" width="180" height="100" rx="4"/>
    <text class="step" x="550" y="96" text-anchor="middle">INT8 量化</text>
    <text class="detail" x="550" y="126" text-anchor="middle">转换为 NPU 模型</text>

    <rect class="box" x="680" y="55" width="180" height="100" rx="4"/>
    <text class="step" x="770" y="96" text-anchor="middle">端侧部署</text>
    <text class="detail" x="770" y="126" text-anchor="middle">MaixCAM Pro</text>

    <rect class="box" x="900" y="55" width="180" height="100" rx="4"/>
    <text class="step" x="990" y="96" text-anchor="middle">实际运行</text>
    <text class="detail" x="990" y="126" text-anchor="middle">检测 / 决策 / UART</text>
  </g>

  <path class="line" d="M 202 105 H 231"/>
  <path class="line" d="M 422 105 H 451"/>
  <path class="line" d="M 642 105 H 671"/>
  <path class="line" d="M 862 105 H 891"/>
</svg>
